version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      # Generating b2input.xml viewer webpages
      - python extras/b2input/fetch_b2input_xml_files.py
          --verbose
          --dest-dir extras/b2input/fetched
          extras/b2input/versions.yaml
      - python extras/b2input/generate_html.py
          --verbose
          --source-dir extras/b2input
          --dest-dir docs/extras/b2input
          extras/b2input/fetched


mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: requirements.txt
