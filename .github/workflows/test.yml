name: Test Build

on:
  push:
    branches: [ master, feature/update-b2input-viewer ]
  pull_request:
    branches: [ master ]

jobs:
  test-mkdocs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test build MkDocs site
        run: mkdocs build --strict --verbose

  test-b2input:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Note: Testing the same command as in .readthedocs.yaml
      - name: Test fetch b2input.xml files
        run: python extras/b2input/fetch_b2input_xml_files.py
                --verbose
                --dest-dir extras/b2input/fetched
                extras/b2input/versions.yaml

      # Note: Testing the same command as in .readthedocs.yaml
      - name: Test generate b2input viewer HTML pages
        run: python extras/b2input/generate_html.py
                --verbose
                --source-dir extras/b2input
                --dest-dir docs/extras/b2input
                extras/b2input/fetched
